<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meta Campaign Analytics Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0a0a0f;--card:#13131f;--card2:#1a1a2e;--border:#2a2a4a;
    --text:#e8e8f0;--muted:#8888aa;
    --blue:#1877F2;--green:#00C896;--red:#FF4466;--yellow:#FFB800;--purple:#9C6FFF;
  }
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh}
  header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:100}
  .logo{display:flex;align-items:center;gap:10px}
  .logo-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#1877F2,#00C896);display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px}
  .header-title h1{font-size:16px;font-weight:700}
  .header-title p{font-size:11px;color:var(--muted)}
  .header-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .btn{padding:7px 16px;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-size:13px;transition:opacity .2s}
  .btn-primary{background:var(--blue);color:#fff}
  .btn-primary:hover{opacity:.85}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed}
  .tag{font-size:11px;padding:3px 8px;border-radius:6px;background:var(--border);color:var(--muted)}

  main{max-width:1400px;margin:0 auto;padding:24px}

  /* Loading & Error */
  .center-screen{min-height:80vh;display:flex;align-items:center;justify-content:center}
  .spinner{width:60px;height:60px;border-radius:50%;border:4px solid transparent;border-top-color:var(--blue);border-right-color:var(--green);animation:spin 1s linear infinite;margin:0 auto 20px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .error-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:32px;text-align:center;max-width:500px}
  .error-box h2{color:#fff;margin-bottom:8px}
  .error-msg{color:var(--red);font-size:12px;font-family:monospace;background:#000;padding:10px;border-radius:6px;margin:12px 0;word-break:break-all}

  /* Tabs */
  .tabs{display:inline-flex;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:24px}
  .tab{padding:8px 20px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:all .2s;background:transparent;color:var(--muted)}
  .tab.active{background:var(--blue);color:#fff}
  .tab-content{display:none}.tab-content.active{display:block}

  /* Cards */
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;transition:border-color .2s}
  .card:hover{border-color:#4a4a7a}
  .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
  .grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  @media(max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:1fr}}
  @media(max-width:500px){.grid-4{grid-template-columns:1fr}.grid-2{grid-template-columns:1fr}}

  /* Metric Card */
  .metric-card{position:relative;overflow:hidden}
  .metric-card .accent-bar{position:absolute;left:0;top:0;width:3px;height:100%;border-radius:2px 0 0 2px}
  .metric-card .body{padding-left:12px}
  .metric-card .label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-bottom:6px}
  .metric-card .value{font-size:24px;font-weight:800;color:#fff}
  .metric-card .sub{font-size:11px;color:var(--muted);margin-top:4px}
  .metric-card .icon{position:absolute;right:16px;top:16px;font-size:22px;opacity:.7}

  /* Campaign Cards */
  .campaign-card{cursor:pointer;margin-bottom:10px}
  .campaign-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .campaign-info .badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
  .badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px}
  .badge-active{background:rgba(0,200,150,.15);color:var(--green)}
  .badge-paused{background:rgba(255,184,0,.15);color:var(--yellow)}
  .badge-other{background:rgba(136,136,170,.15);color:var(--muted)}
  .badge-obj{background:var(--border);color:var(--muted)}
  .campaign-name{font-size:14px;font-weight:600;color:#fff;line-height:1.3;max-width:500px}
  .score-ring{position:relative;flex-shrink:0}
  .score-ring canvas{display:block}
  .score-ring .score-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:13px;font-weight:800}

  .quick-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
  @media(max-width:600px){.quick-metrics{grid-template-columns:repeat(2,1fr)}}
  .qm{background:var(--bg);border-radius:8px;padding:8px;text-align:center}
  .qm .ql{font-size:10px;color:var(--muted)}
  .qm .qv{font-size:14px;font-weight:700;margin-top:2px}

  /* Expand */
  .expand-arrow{font-size:16px;color:var(--muted);flex-shrink:0;margin-top:4px}
  .campaign-details{display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
  .campaign-card.open .campaign-details{display:block}
  .details-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
  @media(max-width:600px){.details-grid{grid-template-columns:repeat(2,1fr)}}
  .dg-item{background:var(--bg);border-radius:8px;padding:8px}
  .dg-item .dl{font-size:10px;color:var(--muted)}
  .dg-item .dv{font-size:13px;font-weight:600;color:#fff}

  /* Recommendations */
  .recs-title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:8px}
  .rec{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
  .rec-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;flex-shrink:0;white-space:nowrap}
  .rec-success{background:rgba(0,200,150,.15);color:var(--green)}
  .rec-warning{background:rgba(255,184,0,.15);color:var(--yellow)}
  .rec-error{background:rgba(255,68,102,.15);color:var(--red)}
  .rec-info{background:rgba(24,119,242,.15);color:#60A5FA}
  .rec-text{font-size:12px;color:var(--text);line-height:1.4}

  /* Filters */
  .filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;align-items:center}
  .filter-group{display:flex;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:3px;gap:2px}
  .filter-btn{padding:5px 12px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:600;background:transparent;color:var(--muted);transition:all .2s}
  .filter-btn.active-all{background:var(--blue);color:#fff}
  .filter-btn.active-active{background:var(--green);color:#fff}
  .filter-btn.active-paused{background:var(--yellow);color:#000}
  select,input[type=text]{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 12px;font-size:12px;outline:none}
  select:focus,input:focus{border-color:var(--blue)}

  /* Charts */
  .chart-wrap{position:relative;width:100%;height:240px}
  .chart-section{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
  @media(max-width:700px){.chart-section{grid-template-columns:1fr}}
  .chart-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:12px}

  /* Alerts */
  .alert-item{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}
  .alert-item:last-child{border-bottom:none}
  .alert-campaign{font-size:11px;color:var(--muted)}
  .alert-text{font-size:13px;color:var(--text)}

  /* Top campaigns */
  .top-card{position:relative;overflow:hidden}
  .top-medal{position:absolute;top:12px;right:12px;font-size:22px}
  .top-score{font-size:28px;font-weight:800}
  .top-score-label{font-size:11px;color:var(--muted)}

  /* Section titles */
  .section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:14px}

  ::-webkit-scrollbar{width:5px;height:5px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>

<div id="app">
  <div class="center-screen">
    <div style="text-align:center">
      <div class="spinner"></div>
      <p style="color:#fff;font-size:16px;font-weight:600">Carregando dashboard...</p>
      <p style="color:var(--muted);font-size:12px;margin-top:6px">Clique em "Buscar Dados" para carregar</p>
      <br>
      <button class="btn btn-primary" onclick="loadData()" style="font-size:15px;padding:10px 28px">
        🚀 Buscar Dados da Meta API
      </button>
    </div>
  </div>
</div>

<script>
const BASE = 'https://graph.facebook.com/v21.0';
const METRICS = 'impressions,reach,frequency,clicks,unique_clicks,ctr,unique_ctr,cpc,cpm,cpp,spend,actions,cost_per_action_type,purchase_roas,outbound_clicks,outbound_clicks_ctr';

let globalData = null;
let charts = {};

const DEFAULT_TOKEN = 'EAAVJJGQJPfUBQ7hEGsZCNUMVLyuqUZAOy4dLF9poHOVSdhbN7kVn8vCcfOX2xmoC1kZCMik5vb4Md2bq7roQRLfmAXUjHzBOIkFrUxqI1IQsT7WPvcbCqq6AqLKpxAyqEClUDcYZCEzcJAjp8YqVPcaVPKHkPm19lCNhsvZAqu5Ay3H8bOYMnlRvZBZCyjsxHwZCLr4BeiPBUOVtnHApCqnk0zsyaQPdtOreiZAYiMymVQQOJr3hzX9hZCPaRDSoIdJOd8q5tn36vMtUICzkAxnHZBw07LU';

function getToken() {
  return localStorage.getItem('meta_token') || DEFAULT_TOKEN;
}

async function apiFetch(endpoint) {
  const token = getToken();
  if (!token) throw new Error('Token não configurado. Insira seu User Access Token.');
  const sep = endpoint.includes('?') ? '&' : '?';
  const url = `${BASE}/${endpoint}${sep}access_token=${token}`;
  const res = await fetch(url);
  const json = await res.json();
  if (json.error) throw new Error(json.error.message + ' (code: ' + json.error.code + ')');
  return json;
}

async function fetchAllPages(endpoint) {
  let all = [];
  let data = await apiFetch(endpoint);
  if (data.data) all = all.concat(data.data); else return [data];
  while (data.paging && data.paging.next) {
    try {
      const next = new URL(data.paging.next);
      let nextPath = (next.pathname + next.search).replace('/v21.0/', '').replace('?access_token=' + TOKEN + '&', '?').replace('&access_token=' + TOKEN, '');
      data = await apiFetch(nextPath);
      if (!data.data) break;
      all = all.concat(data.data);
    } catch(e) { break; }
  }
  return all;
}

function genRecs({ ctr, cpc, cpm, cpa, frequency, spend, conversions, status }) {
  const r = [];
  if (status === 'PAUSED') r.push({ type:'info', text:'Campanha pausada. Avalie se deve ser reativada ou arquivada.' });
  if (frequency > 3.5) r.push({ type:'warning', text:`Frequência alta (${frequency.toFixed(1)}x). Renove os criativos para evitar fadiga do público.` });
  if (ctr < 0.5 && ctr > 0) r.push({ type:'warning', text:`CTR baixo (${ctr.toFixed(2)}%). Teste novos criativos ou reveja a segmentação.` });
  else if (ctr >= 2) r.push({ type:'success', text:`CTR excelente (${ctr.toFixed(2)}%). Considere escalar o orçamento desta campanha.` });
  if (cpc > 5 && cpc < 999) r.push({ type:'warning', text:`CPC elevado (R$ ${cpc.toFixed(2)}). Melhore o Quality Score ou reduza o lance.` });
  if (cpm > 50 && cpm < 999) r.push({ type:'warning', text:`CPM alto (R$ ${cpm.toFixed(2)}). Segmentação pode estar muito restrita.` });
  if (conversions === 0 && spend > 100) r.push({ type:'error', text:`Sem conversões com R$ ${spend.toFixed(2)} investidos. Verifique o pixel e a landing page.` });
  if (cpa > 0 && cpa < 30) r.push({ type:'success', text:`CPA eficiente (R$ ${cpa.toFixed(2)}). Excelente retorno — aumente o orçamento.` });
  else if (cpa > 100) r.push({ type:'error', text:`CPA muito alto (R$ ${cpa.toFixed(2)}). Reveja o funil e o público-alvo.` });
  if (r.length === 0) r.push({ type:'info', text:'Aguarde mais dados para uma análise completa desta campanha.' });
  return r;
}

function calcScore({ ctr, cpc, cpm, frequency, conversions }) {
  let s = 50;
  if (ctr >= 2) s += 20; else if (ctr >= 1) s += 10; else if (ctr < 0.5 && ctr > 0) s -= 10;
  if (frequency > 4) s -= 15; else if (frequency > 3) s -= 5;
  if (conversions > 0) s += 15;
  if (cpc < 3 && cpc > 0) s += 10; else if (cpc > 10) s -= 10;
  return Math.max(0, Math.min(100, s));
}

function scoreColor(s) { return s >= 70 ? '#00C896' : s >= 40 ? '#FFB800' : '#FF4466'; }

function fmt(n, pre='', suf='', dec=2) {
  if (n === null || n === undefined || isNaN(n)) return 'N/A';
  return pre + Number(n).toFixed(dec) + suf;
}
function fmtN(n) { return (n||0).toLocaleString('pt-BR'); }

function showAccountPicker(accounts, me) {
  return new Promise((resolve) => {
    const statusLabel = {1:'Ativa',2:'Desativada',3:'Não configurada',7:'Pendente',8:'Pendente revisão',9:'Em revisão',100:'Pendente fechamento',101:'Fechada',201:'Qualquer advertência'};
    document.getElementById('app').innerHTML = `
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px">
        <div style="max-width:680px;width:100%">
          <div class="card" style="padding:32px">
            <h2 style="color:#fff;font-size:20px;margin-bottom:4px">Selecione a conta de anúncio</h2>
            <p style="color:var(--muted);font-size:13px;margin-bottom:24px">Usuário: <strong style="color:#fff">${me.name}</strong> &bull; ${accounts.length} conta(s) encontrada(s)</p>
            <div style="display:flex;flex-direction:column;gap:10px;max-height:420px;overflow-y:auto;padding-right:4px">
              ${accounts.map(a => `
                <div onclick="selectAccount('${a.id}', this)"
                  style="background:var(--bg);border:2px solid var(--border);border-radius:10px;padding:14px 18px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:space-between;gap:12px"
                  class="acc-item">
                  <div>
                    <p style="font-weight:700;color:#fff;font-size:14px">${a.name || '(sem nome)'}</p>
                    <p style="font-size:11px;color:var(--muted);margin-top:2px">ID: ${a.account_id || a.id} &bull; Status: ${statusLabel[a.account_status]||a.account_status} &bull; Gasto total: R$ ${parseFloat(a.amount_spent||0)/100 > 0 ? (parseFloat(a.amount_spent||0)/100).toFixed(2) : '0,00'}</p>
                  </div>
                  <span style="font-size:20px;opacity:.4">→</span>
                </div>`).join('')}
            </div>
            <p style="font-size:11px;color:var(--muted);margin-top:16px;text-align:center">A escolha será salva — na próxima vez abre direto.</p>
          </div>
        </div>
      </div>`;

    window.selectAccount = (id, el) => {
      document.querySelectorAll('.acc-item').forEach(x => {
        x.style.borderColor = 'var(--border)';
        x.style.background = 'var(--bg)';
      });
      el.style.borderColor = 'var(--blue)';
      el.style.background = 'rgba(24,119,242,.08)';
      localStorage.setItem('meta_selected_account', id);
      setTimeout(() => {
        const chosen = accounts.filter(a => a.id === id);
        resolve(chosen);
      }, 300);
    };
  });
}

async function loadData() {
  document.getElementById('app').innerHTML = `
    <div class="center-screen">
      <div style="text-align:center">
        <div class="spinner"></div>
        <p style="color:#fff;font-size:16px;font-weight:600" id="loading-msg">Autenticando com Meta API...</p>
        <p style="color:var(--muted);font-size:12px;margin-top:6px" id="loading-sub">Buscando todas as campanhas e métricas (todo o tempo)</p>
      </div>
    </div>`;

  try {
    const setMsg = (m, s='') => {
      document.getElementById('loading-msg').textContent = m;
      if (s) document.getElementById('loading-sub').textContent = s;
    };

    setMsg('Buscando informações do usuário...');
    const me = await apiFetch('me?fields=id,name');

    setMsg('Buscando contas de anúncio...', `Usuário: ${me.name}`);
    const allAccounts = await fetchAllPages(`${me.id}/adaccounts?fields=id,name,account_status,currency,amount_spent&limit=100`);

    // Verificar se há conta salva
    const savedAccountId = localStorage.getItem('meta_selected_account');
    let selectedAccounts;

    if (savedAccountId) {
      selectedAccounts = allAccounts.filter(a => a.id === savedAccountId);
    }

    if (!selectedAccounts || selectedAccounts.length === 0) {
      // Mostrar seletor de conta e aguardar escolha
      selectedAccounts = await showAccountPicker(allAccounts, me);
    }

    const accounts = selectedAccounts;

    let allCampaigns = [];
    const allInsights = {};

    for (let i = 0; i < accounts.length; i++) {
      const acc = accounts[i];
      setMsg(`Buscando campanhas...`, acc.name || acc.id);
      const campaigns = await fetchAllPages(`${acc.id}/campaigns?fields=id,name,status,objective,created_time,start_time,stop_time,daily_budget,lifetime_budget&limit=100`);
      allCampaigns = allCampaigns.concat(campaigns);

      for (let j = 0; j < campaigns.length; j++) {
        const c = campaigns[j];
        setMsg(`Insights: ${j+1}/${campaigns.length} campanhas`, c.name.substring(0, 50) + '...');
        try {
          const ins = await fetchAllPages(`${c.id}/insights?fields=${METRICS}&date_preset=maximum&limit=1`);
          allInsights[c.id] = ins;
        } catch(e) { allInsights[c.id] = []; }
      }
    }

    setMsg('Processando análise...');

    const summary = {
      total_campaigns: allCampaigns.length,
      active: allCampaigns.filter(c=>c.status==='ACTIVE').length,
      paused: allCampaigns.filter(c=>c.status==='PAUSED').length,
      spend: 0, impressions: 0, clicks: 0, conversions: 0, reach: 0
    };

    const campaigns = allCampaigns.map(c => {
      const ins = (allInsights[c.id] || [])[0] || {};
      const spend = parseFloat(ins.spend||0);
      const impressions = parseInt(ins.impressions||0);
      const clicks = parseInt(ins.clicks||0);
      const ctr = parseFloat(ins.ctr||0);
      const cpc = parseFloat(ins.cpc||0);
      const cpm = parseFloat(ins.cpm||0);
      const reach = parseInt(ins.reach||0);
      const frequency = parseFloat(ins.frequency||0);
      let conversions=0, cpa=0;
      if(ins.actions){
        const pa = ins.actions.find(a=>a.action_type==='purchase'||a.action_type==='offsite_conversion.fb_pixel_purchase');
        if(pa){ conversions=parseInt(pa.value||0); cpa=conversions>0?spend/conversions:0; }
      }
      const roas = ins.purchase_roas?.[0]?.value ? parseFloat(ins.purchase_roas[0].value) : null;
      summary.spend += spend;
      summary.impressions += impressions;
      summary.clicks += clicks;
      summary.conversions += conversions;
      summary.reach += reach;
      const score = calcScore({ctr,cpc,cpm,frequency,conversions});
      return {
        id:c.id, name:c.name, status:c.status, objective:c.objective||'N/A',
        created_time:c.created_time,
        metrics:{spend,impressions,reach,clicks,ctr,cpc,cpm,frequency,conversions,cpa,roas,
          unique_clicks:parseInt(ins.unique_clicks||0)},
        recommendations:genRecs({ctr,cpc,cpm,cpa,frequency,spend,conversions,status:c.status}),
        performance_score:score,
      };
    });

    campaigns.sort((a,b)=>b.metrics.spend-a.metrics.spend);
    summary.avg_ctr = summary.impressions>0 ? (summary.clicks/summary.impressions*100) : 0;
    summary.avg_cpc = summary.clicks>0 ? (summary.spend/summary.clicks) : 0;

    globalData = { user:me, accounts, all_accounts: allAccounts, summary, campaigns, generated_at:new Date().toISOString() };

    // Save to localStorage
    try { localStorage.setItem('meta_dashboard_data', JSON.stringify(globalData)); } catch(e){}

    renderDashboard();
  } catch(e) {
    // If it's an auth error, show the token setup screen
    const isAuthError = e.message.includes('2500') || e.message.includes('190') || e.message.includes('access token') || e.message.includes('Token');
    if (isAuthError) {
      showTokenSetup(e.message);
    } else {
      document.getElementById('app').innerHTML = `
        <div class="center-screen">
          <div class="error-box">
            <div style="font-size:40px;margin-bottom:12px">⚠️</div>
            <h2>Erro ao buscar dados</h2>
            <div class="error-msg">${e.message}</div>
            <p style="color:var(--muted);font-size:12px;margin-bottom:16px">Verifique se o token está válido e tem permissões de leitura de anúncios (ads_read).</p>
            <div style="display:flex;gap:10px;justify-content:center">
              <button class="btn btn-primary" onclick="loadData()">Tentar Novamente</button>
              <button class="btn" style="background:var(--border);color:var(--text)" onclick="showTokenSetup(null)">⚙ Trocar Token</button>
            </div>
          </div>
        </div>`;
    }
  }
}

function renderDashboard() {
  const d = globalData;
  const s = d.summary;

  document.getElementById('app').innerHTML = `
  <header>
    <div class="logo">
      <div class="logo-icon">M</div>
      <div class="header-title">

function metricCard(title, value, sub, color, icon) {
  return `<div class="card metric-card"><div class="accent-bar" style="background:${color}"></div><span class="icon">${icon}</span>
    <div class="body"><div class="label">${title}</div><div class="value">${value}</div><div class="sub">${sub}</div></div></div>`;
}

function statusClass(s) { return s==='ACTIVE'?'badge-active':s==='PAUSED'?'badge-paused':'badge-other'; }

function renderCampaigns() {
  const d = globalData;
  const f = window._filter, so = window._sort, se = window._search.toLowerCase();
  let list = d.campaigns
    .filter(c => f==='ALL' || c.status===f)
    .filter(c => !se || c.name.toLowerCase().includes(se))
    .sort((a,b) => so==='spend'?b.metrics.spend-a.metrics.spend:so==='ctr'?b.metrics.ctr-a.metrics.ctr:so==='score'?b.performance_score-a.performance_score:b.metrics.conversions-a.metrics.conversions);

  document.getElementById('camp-count').textContent = `${list.length} campanhas encontradas (clique para expandir)`;

  const container = document.getElementById('campaigns-list');
  container.innerHTML = list.length === 0
    ? '<div class="card" style="text-align:center;padding:32px;color:var(--muted)">Nenhuma campanha encontrada.</div>'
    : list.map(c => campaignCardHTML(c)).join('');
}

function campaignCardHTML(c) {
  const m = c.metrics;
  const sc = scoreColor(c.performance_score);
  const ctrColor = m.ctr >= 1.5 ? '#00C896' : m.ctr >= 0.5 ? '#FFB800' : '#FF4466';
  const cpcColor = (m.cpc<3&&m.cpc>0) ? '#00C896' : m.cpc>8 ? '#FF4466' : '#FFB800';

  const recsHTML = c.recommendations.map(r=>`
    <div class="rec">
      <span class="rec-badge rec-${r.type}">${r.type==='success'?'✓':r.type==='warning'?'⚠':r.type==='error'?'✗':'ℹ'}</span>
      <span class="rec-text">${r.text}</span>
    </div>`).join('');

  const detailItems = [
    ['Impressões', fmtN(m.impressions)],['Alcance', fmtN(m.reach)],
    ['Cliques', fmtN(m.clicks)],['Cliques Únicos', fmtN(m.unique_clicks)],
    ['Frequência', fmt(m.frequency,'','x')],['CPM', fmt(m.cpm,'R$ ')],
    ['CPA', m.cpa>0?fmt(m.cpa,'R$ '):'N/A'],['ROAS', m.roas?fmt(m.roas,'','x'):'N/A'],
  ].map(([l,v])=>`<div class="dg-item"><div class="dl">${l}</div><div class="dv">${v}</div></div>`).join('');

  return `<div class="card campaign-card" id="cc-${c.id}" onclick="toggleCampaign('${c.id}')">
    <div class="campaign-header">
      <div class="campaign-info">
        <div class="badges">
          <span class="badge ${statusClass(c.status)}">${c.status}</span>
          <span class="badge badge-obj">${c.objective}</span>
        </div>
        <div class="campaign-name">${c.name}</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <div style="text-align:center">
          <div style="font-size:22px;font-weight:800;color:${sc}">${c.performance_score}</div>
          <div style="font-size:9px;color:var(--muted)">SCORE</div>
        </div>
        <span class="expand-arrow">▼</span>
      </div>
    </div>
    <div class="quick-metrics">
      <div class="qm"><div class="ql">Investido</div><div class="qv" style="color:#fff">R$ ${m.spend.toFixed(2)}</div></div>
      <div class="qm"><div class="ql">CTR</div><div class="qv" style="color:${ctrColor}">${m.ctr.toFixed(2)}%</div></div>
      <div class="qm"><div class="ql">CPC</div><div class="qv" style="color:${cpcColor}">R$ ${m.cpc.toFixed(2)}</div></div>
      <div class="qm"><div class="ql">Conversões</div><div class="qv" style="color:#fff">${m.conversions}</div></div>
    </div>
    <div class="campaign-details">
      <div class="details-grid">${detailItems}</div>
      <div class="recs-title">Recomendações</div>
      ${recsHTML}
    </div>
  </div>`;
}

function toggleCampaign(id) {
  document.getElementById('cc-'+id).classList.toggle('open');
}

function setFilter(f, btn) {
  window._filter = f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.className='filter-btn');
  btn.className = 'filter-btn active-'+f.toLowerCase();
  renderCampaigns();
}

function setSort(v) { window._sort = v; renderCampaigns(); }
function setSearch(v) { window._search = v; renderCampaigns(); }

function switchTab(name, btn) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
  if (name === 'charts') setTimeout(renderCharts, 50);
}

function renderCharts() {
  if (!globalData) return;
  const d = globalData;
  const gridColor = '#2a2a4a';
  const tickColor = '#8888aa';
  const tooltipStyle = {
    backgroundColor: '#13131f', borderColor: '#2a2a4a', borderWidth: 1,
    titleColor: '#e8e8f0', bodyColor: '#e8e8f0', padding: 10,
  };

  const top8 = [...d.campaigns].filter(c=>c.metrics.spend>0).slice(0,8);
  const short = n => n.length > 18 ? n.substring(0,18)+'…' : n;

  // Destroy old charts
  Object.values(charts).forEach(c => { try { c.destroy(); } catch(e){} });
  charts = {};

  // Spend chart
  charts.spend = new Chart(document.getElementById('chart-spend'), {
    type: 'bar',
    data: {
      labels: top8.map(c=>short(c.name)),
      datasets: [{ data: top8.map(c=>c.metrics.spend.toFixed(2)), backgroundColor: '#1877F2', borderRadius: 6 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend:{display:false}, tooltip:{...tooltipStyle, callbacks:{label:v=>`R$ ${Number(v.raw).toFixed(2)}`}} },
      scales: {
        x: { ticks:{color:tickColor,maxRotation:35,font:{size:10}}, grid:{color:gridColor} },
        y: { ticks:{color:tickColor,callback:v=>'R$'+v}, grid:{color:gridColor} }
      }
    }
  });

  // Status pie
  const statuses = {};
  d.campaigns.forEach(c => { statuses[c.status] = (statuses[c.status]||0)+1; });
  const statusColors = { ACTIVE:'#00C896', PAUSED:'#FFB800', ARCHIVED:'#8888aa', DELETED:'#FF4466' };
  charts.status = new Chart(document.getElementById('chart-status'), {
    type: 'doughnut',
    data: {
      labels: Object.keys(statuses),
      datasets: [{ data: Object.values(statuses), backgroundColor: Object.keys(statuses).map(k=>statusColors[k]||'#9C6FFF'), borderWidth: 2, borderColor: '#13131f' }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend:{labels:{color:tickColor,font:{size:11}}}, tooltip:{...tooltipStyle} }
    }
  });

  // Score chart
  const top10 = [...d.campaigns].sort((a,b)=>b.performance_score-a.performance_score).slice(0,10);
  charts.score = new Chart(document.getElementById('chart-score'), {
    type: 'bar',
    data: {
      labels: top10.map(c=>short(c.name)),
      datasets: [{ data: top10.map(c=>c.performance_score), backgroundColor: top10.map(c=>scoreColor(c.performance_score)), borderRadius: 6 }]
    },
    options: {
      indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      plugins: { legend:{display:false}, tooltip:{...tooltipStyle, callbacks:{label:v=>`${v.raw}/100`}} },
      scales: {
        x: { min:0, max:100, ticks:{color:tickColor}, grid:{color:gridColor} },
        y: { ticks:{color:tickColor,font:{size:10}}, grid:{display:false} }
      }
    }
  });

  // CTR chart
  charts.ctr = new Chart(document.getElementById('chart-ctr'), {
    type: 'bar',
    data: {
      labels: top8.map(c=>short(c.name)),
      datasets: [{ data: top8.map(c=>c.metrics.ctr.toFixed(3)), backgroundColor: '#00C896', borderRadius: 6 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend:{display:false}, tooltip:{...tooltipStyle, callbacks:{label:v=>`${Number(v.raw).toFixed(2)}%`}} },
      scales: {
        x: { ticks:{color:tickColor,maxRotation:35,font:{size:10}}, grid:{color:gridColor} },
        y: { ticks:{color:tickColor,callback:v=>v+'%'}, grid:{color:gridColor} }
      }
    }
  });

  // Clicks chart
  charts.clicks = new Chart(document.getElementById('chart-clicks'), {
    type: 'bar',
    data: {
      labels: top8.map(c=>short(c.name)),
      datasets: [{ data: top8.map(c=>c.metrics.clicks), backgroundColor: '#9C6FFF', borderRadius: 6 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend:{display:false}, tooltip:{...tooltipStyle} },
      scales: {
        x: { ticks:{color:tickColor,maxRotation:35,font:{size:10}}, grid:{color:gridColor} },
        y: { ticks:{color:tickColor}, grid:{color:gridColor} }
      }
    }
  });
}

async function searchInterests(query) {
  try {
    const r = await apiFetch(`search?type=adinterest&q=${encodeURIComponent(query)}&limit=3`);
    return (r.data || []).slice(0, 2).map(i => ({ id: i.id, name: i.name, audience_size: i.audience_size_lower_bound }));
  } catch(e) { return []; }
}

async function searchBehaviors(query) {
  try {
    const r = await apiFetch(`search?type=adTargetingCategory&class=behaviors&q=${encodeURIComponent(query)}&limit=3`);
    return (r.data || []).slice(0, 2).map(b => ({ id: b.id, name: b.name }));
  } catch(e) { return []; }
}

async function loadAudienceManagement() {
  const container = document.getElementById('audience-content');
  container.innerHTML = `<div class="card" style="text-align:center;padding:32px"><div class="spinner" style="margin:0 auto 16px"></div><p style="color:#fff;font-weight:600" id="aud-msg">Buscando ad sets das campanhas...</p></div>`;

  const setMsg = m => { const el = document.getElementById('aud-msg'); if(el) el.textContent = m; };

  try {
    const d = globalData;
    const accountId = localStorage.getItem('meta_selected_account');

    // Fetch all adsets with targeting
    setMsg('Lendo targeting atual dos ad sets...');
    const adsets = await fetchAllPages(`${accountId}/adsets?fields=id,name,status,campaign_id,targeting,age_min,age_max,optimization_goal,billing_event,daily_budget,lifetime_budget&limit=200`);

    // Map campaigns by id
    const campaignMap = {};
    d.campaigns.forEach(c => { campaignMap[c.id] = c; });

    // Match adsets to ARQ / BRANDING / AUDIOVISUAL campaigns
    const matched = { ARQ: [], BRANDING: [], AUDIOVISUAL: [] };
    const unmatchedCampaigns = new Set();

    adsets.forEach(as => {
      const camp = campaignMap[as.campaign_id];
      const campName = (camp?.name || '').toUpperCase();
      const asName = (as.name || '').toUpperCase();
      const combined = campName + ' ' + asName;

      if (/ARQ|ARQUITETURA|ARCHITECT|DESIGN DE INTERIOR/i.test(combined)) matched.ARQ.push({ ...as, campaign: camp });
      else if (/BRANDING|BRAND|MARCA|IDENTIDADE/i.test(combined)) matched.BRANDING.push({ ...as, campaign: camp });
      else if (/AUDIOVISUAL|AUDIO|VISUAL|VIDEO|VÍDEO|PRODUÇÃO|CONTEÚDO|CONTENT/i.test(combined)) matched.AUDIOVISUAL.push({ ...as, campaign: camp });
      else unmatchedCampaigns.add(camp?.name || as.campaign_id);
    });

    // Search for interest & behavior IDs
    setMsg('Buscando IDs de interesses e comportamentos na Meta API...');
    const resolvedPlaybook = {};

    for (const [key, pb] of Object.entries(AUDIENCE_PLAYBOOK)) {
      setMsg(`Resolvendo interesses para ${pb.label}...`);
      const interests = [];
      for (const q of pb.interest_queries.slice(0, 4)) {
        const found = await searchInterests(q);
        interests.push(...found);
      }
      const behaviors = [];
      for (const q of pb.behavior_queries.slice(0, 3)) {
        const found = await searchBehaviors(q);
        behaviors.push(...found);
      }
      const exclusions = [];
      for (const q of pb.exclusion_queries.slice(0, 2)) {
        const found = await searchInterests(q);
        exclusions.push(...found);
      }
      // Deduplicate by id
      resolvedPlaybook[key] = {
        ...pb,
        resolved_interests: [...new Map(interests.map(i=>[i.id,i])).values()].slice(0,8),
        resolved_behaviors: [...new Map(behaviors.map(b=>[b.id,b])).values()].slice(0,4),
        resolved_exclusions: [...new Map(exclusions.map(e=>[e.id,e])).values()].slice(0,4),
      };
    }

    renderAudiencePlan(matched, resolvedPlaybook, adsets, unmatchedCampaigns);

  } catch(e) {
    container.innerHTML = `<div class="card" style="padding:24px">
      <p style="color:var(--red);font-size:13px">Erro: ${e.message}</p>
      <button class="btn btn-primary" style="margin-top:12px" onclick="loadAudienceManagement()">Tentar novamente</button>
    </div>`;
  }
}

function renderCurrentTargeting(targeting) {
  if (!targeting) return '<span style="color:var(--muted);font-size:11px">Sem targeting definido</span>';
  const parts = [];
  if (targeting.age_min || targeting.age_max) parts.push(`Idade: ${targeting.age_min||'?'}–${targeting.age_max||'?'}`);
  const ints = targeting.flexible_spec?.flatMap(fs => fs.interests||[]) || [];
  if (ints.length) parts.push(`Interesses: ${ints.slice(0,3).map(i=>i.name).join(', ')}${ints.length>3?` +${ints.length-3}`:''}`);
  const behs = targeting.flexible_spec?.flatMap(fs => fs.behaviors||[]) || [];
  if (behs.length) parts.push(`Comportamentos: ${behs.slice(0,2).map(b=>b.name).join(', ')}`);
  const excl = targeting.exclusions?.interests || [];
  if (excl.length) parts.push(`Excluídos: ${excl.slice(0,2).map(e=>e.name).join(', ')}`);
  const geos = targeting.geo_locations?.cities?.map(c=>c.name) || targeting.geo_locations?.regions?.map(r=>r.name) || [];
  if (geos.length) parts.push(`Locais: ${geos.slice(0,3).join(', ')}`);
  return parts.length ? parts.map(p=>`<span style="display:block;font-size:11px;color:var(--muted);margin-bottom:2px">• ${p}</span>`).join('') : '<span style="color:var(--muted);font-size:11px">Targeting padrão (sem especificações)</span>';
}

function buildNewTargeting(pb, existingTargeting) {
  const geo = existingTargeting?.geo_locations || { countries: ['BR'] };
  return {
    age_min: pb.age_min,
    age_max: pb.age_max,
    geo_locations: geo,
    flexible_spec: [
      {
        interests: pb.resolved_interests.slice(0, 5).map(i => ({ id: i.id, name: i.name })),
        behaviors: pb.resolved_behaviors.slice(0, 3).map(b => ({ id: b.id, name: b.name })),
      }
    ],
    exclusions: {
      interests: pb.resolved_exclusions.map(e => ({ id: e.id, name: e.name })),
      age_max: pb.exclude_age_max,
    }
  };
}

function renderAudiencePlan(matched, playbook, allAdsets, unmatched) {
  const container = document.getElementById('audience-content');

  const totalMatched = Object.values(matched).reduce((s, arr) => s + arr.length, 0);

  let html = `
    <div style="margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
      <div>
        <h2 style="color:#fff;font-size:18px;font-weight:700">Plano de Ajuste de Público</h2>
        <p style="color:var(--muted);font-size:12px">${totalMatched} ad sets detectados nas 3 campanhas &bull; Revise cada bloco antes de aplicar</p>
      </div>
      <button class="btn" style="background:var(--border);color:var(--text)" onclick="loadAudienceManagement()">↺ Reanalisar</button>
    </div>`;

  if (totalMatched === 0) {
    html += `<div class="card" style="padding:24px;text-align:center">
      <p style="color:var(--yellow);margin-bottom:8px">⚠ Nenhum ad set encontrado para ARQ, BRANDING ou AUDIOVISUAL pelo nome.</p>
      <p style="color:var(--muted);font-size:12px">Verifique se os nomes das campanhas ou ad sets contêm essas palavras-chave.</p>
      <p style="color:var(--muted);font-size:11px;margin-top:8px">Campanhas sem match: ${[...unmatched].slice(0,5).join(', ')}</p>
    </div>`;
  }

  for (const [key, pb] of Object.entries(playbook)) {
    const adsets = matched[key];
    const newTargeting = adsets.length > 0 ? buildNewTargeting(pb, adsets[0].targeting) : buildNewTargeting(pb, null);

    html += `
    <div class="card" style="margin-bottom:16px;border-left:3px solid ${pb.color}">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px">
        <div>
          <span style="font-size:22px">${pb.emoji}</span>
          <span style="font-size:16px;font-weight:700;color:#fff;margin-left:8px">${pb.label}</span>
          <span class="badge badge-obj" style="margin-left:8px">${adsets.length} ad set(s) detectado(s)</span>
        </div>
        <div style="display:flex;gap:8px">
          ${adsets.length > 0 ? `<button class="btn" style="background:rgba(24,119,242,.15);color:var(--blue);font-size:12px" onclick="confirmApply('${key}', this)">✓ Aplicar Mudanças</button>` : ''}
        </div>
      </div>

      <!-- Diagnóstico -->
      <div style="background:rgba(255,68,102,.07);border:1px solid rgba(255,68,102,.2);border-radius:8px;padding:12px;margin-bottom:14px">
        <p style="font-size:11px;font-weight:700;color:var(--red);margin-bottom:4px">PROBLEMA IDENTIFICADO</p>
        <p style="font-size:12px;color:var(--text)">${pb.diagnosis}</p>
        <p style="font-size:12px;color:var(--green);margin-top:4px">→ <strong>Objetivo:</strong> ${pb.goal}</p>
      </div>

      ${adsets.length > 0 ? `
      <!-- Ad sets atuais -->
      <p style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:8px">AD SETS DETECTADOS</p>
      ${adsets.map(as => `
        <div style="background:var(--bg);border-radius:8px;padding:10px 14px;margin-bottom:8px">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
            <span class="badge ${as.status==='ACTIVE'?'badge-active':'badge-paused'}">${as.status}</span>
            <span style="font-size:13px;font-weight:600;color:#fff">${as.name}</span>
          </div>
          <p style="font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px">TARGETING ATUAL:</p>
          ${renderCurrentTargeting(as.targeting)}
        </div>`).join('')}
      ` : `<div style="background:var(--bg);border-radius:8px;padding:12px;margin-bottom:12px"><p style="color:var(--yellow);font-size:12px">⚠ Nenhum ad set encontrado com este nome. As mudanças serão geradas como template para aplicação manual.</p></div>`}

      <!-- Mudanças propostas -->
      <div style="background:rgba(0,200,150,.07);border:1px solid rgba(0,200,150,.2);border-radius:8px;padding:14px;margin-top:4px">
        <p style="font-size:11px;font-weight:700;color:var(--green);margin-bottom:10px">MUDANÇAS PROPOSTAS</p>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
          <div>
            <p style="font-size:10px;color:var(--muted);font-weight:700;margin-bottom:4px">FAIXA ETÁRIA</p>
            <p style="font-size:13px;color:#fff;font-weight:600">${pb.age_min}–${pb.age_max} anos</p>
            <p style="font-size:10px;color:var(--muted);margin-top:2px">Excluir: 18–${pb.exclude_age_max}</p>
          </div>
          <div>
            <p style="font-size:10px;color:var(--muted);font-weight:700;margin-bottom:4px">INTERESSES (${pb.resolved_interests.length} encontrados)</p>
            ${pb.resolved_interests.slice(0,5).map(i=>`<span style="display:inline-block;background:rgba(24,119,242,.15);color:#60A5FA;font-size:10px;padding:1px 6px;border-radius:4px;margin:1px">${i.name}</span>`).join('')}
          </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
          <div>
            <p style="font-size:10px;color:var(--muted);font-weight:700;margin-bottom:4px">COMPORTAMENTOS (${pb.resolved_behaviors.length} encontrados)</p>
            ${pb.resolved_behaviors.map(b=>`<span style="display:inline-block;background:rgba(156,111,255,.15);color:#c4a0ff;font-size:10px;padding:1px 6px;border-radius:4px;margin:1px">${b.name}</span>`).join('')}
          </div>
          <div>
            <p style="font-size:10px;color:var(--muted);font-weight:700;margin-bottom:4px">EXCLUSÕES</p>
            ${pb.resolved_exclusions.map(e=>`<span style="display:inline-block;background:rgba(255,68,102,.15);color:var(--red);font-size:10px;padding:1px 6px;border-radius:4px;margin:1px">${e.name}</span>`).join('')}
          </div>
        </div>

        <!-- Justificativas -->
        <p style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:6px">JUSTIFICATIVAS</p>
        ${Object.entries(pb.justifications).map(([k,v])=>`
          <div style="display:flex;gap:8px;margin-bottom:5px">
            <span style="font-size:10px;font-weight:700;color:${pb.color};width:80px;flex-shrink:0;text-transform:uppercase">${k}</span>
            <span style="font-size:11px;color:var(--text)">${v}</span>
          </div>`).join('')}
      </div>

      <!-- Confirm area -->
      <div id="confirm-${key}" style="display:none;margin-top:12px;background:rgba(255,184,0,.08);border:1px solid rgba(255,184,0,.3);border-radius:8px;padding:14px">
        <p style="color:var(--yellow);font-weight:700;margin-bottom:6px">⚠ Confirmar aplicação das mudanças?</p>
        <p style="color:var(--muted);font-size:12px;margin-bottom:12px">As mudanças serão aplicadas nos <strong style="color:#fff">${adsets.length} ad set(s)</strong> acima. Os ad sets continuarão com o mesmo status (ativo/pausado).</p>
        <div style="display:flex;gap:8px">
          <button class="btn btn-primary" style="font-size:12px" onclick="applyAudienceChanges('${key}')">✓ Confirmar e Aplicar</button>
          <button class="btn" style="background:var(--border);color:var(--text);font-size:12px" onclick="cancelApply('${key}')">Cancelar</button>
        </div>
      </div>
      <div id="result-${key}" style="margin-top:10px"></div>
    </div>`;
  }

  // Store data for apply function
  window._audienceData = { matched, playbook, allAdsets };
  container.innerHTML = html;
}

function confirmApply(key, btn) {
  document.getElementById(`confirm-${key}`).style.display = 'block';
  btn.style.display = 'none';
}

function cancelApply(key) {
  document.getElementById(`confirm-${key}`).style.display = 'none';
}

async function applyAudienceChanges(key) {
  const { matched, playbook } = window._audienceData;
  const adsets = matched[key];
  const pb = playbook[key];
  const resultEl = document.getElementById(`result-${key}`);
  const confirmEl = document.getElementById(`confirm-${key}`);

  confirmEl.style.display = 'none';
  resultEl.innerHTML = `<div style="text-align:center;padding:12px"><div class="spinner" style="margin:0 auto 8px;width:32px;height:32px;border-width:3px"></div><p style="color:var(--muted);font-size:12px">Aplicando mudanças...</p></div>`;

  const results = [];

  for (const as of adsets) {
    try {
      const newTargeting = buildNewTargeting(pb, as.targeting);
      // Merge geo from existing targeting
      if (as.targeting?.geo_locations) newTargeting.geo_locations = as.targeting.geo_locations;

      const body = new URLSearchParams();
      body.append('targeting', JSON.stringify(newTargeting));
      body.append('access_token', getToken());

      const res = await fetch(`${BASE}/${as.id}`, { method: 'POST', body });
      const json = await res.json();

      if (json.error) throw new Error(json.error.message);
      results.push({ name: as.name, success: true });
    } catch(e) {
      results.push({ name: as.name, success: false, error: e.message });
    }
  }

  const allOk = results.every(r => r.success);
  resultEl.innerHTML = `
    <div style="background:${allOk?'rgba(0,200,150,.08)':'rgba(255,68,102,.08)'};border:1px solid ${allOk?'rgba(0,200,150,.3)':'rgba(255,68,102,.3)'};border-radius:8px;padding:14px">
      <p style="font-weight:700;color:${allOk?'var(--green)':'var(--red)'};margin-bottom:8px">${allOk?'✓ Mudanças aplicadas com sucesso!':'⚠ Algumas mudanças falharam'}</p>
      ${results.map(r=>`<p style="font-size:12px;color:${r.success?'var(--green)':'var(--red)'}">
        ${r.success?'✓':'✗'} ${r.name}${r.error?' — '+r.error:''}
      </p>`).join('')}
      ${allOk ? `<p style="font-size:11px;color:var(--muted);margin-top:8px">Verifique no Meta Ads Manager para confirmar as alterações.</p>` : ''}
    </div>`;
}

  document.getElementById('app').innerHTML = `
    <div class="center-screen">
      <div style="max-width:580px;width:100%;padding:0 16px">
        <div class="card" style="padding:32px">
          <div style="text-align:center;margin-bottom:24px">
            <div style="font-size:48px;margin-bottom:12px">🔑</div>
            <h2 style="color:#fff;font-size:20px;margin-bottom:8px">Configure seu Access Token</h2>
            <p style="color:var(--muted);font-size:13px">É necessário um <strong style="color:#fff">User Access Token</strong> com permissão <code style="background:#000;padding:2px 6px;border-radius:4px;color:var(--green)">ads_read</code></p>
          </div>

          ${errorMsg ? `<div style="background:rgba(255,68,102,.1);border:1px solid rgba(255,68,102,.3);border-radius:8px;padding:12px;margin-bottom:20px;color:var(--red);font-size:12px;font-family:monospace">⚠ ${errorMsg}</div>` : ''}

          <div style="background:var(--bg);border-radius:10px;padding:16px;margin-bottom:20px">
            <p style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px">📖 Como obter o token:</p>
            <ol style="font-size:12px;color:var(--text);line-height:1.8;padding-left:18px">
              <li>Acesse <a href="https://developers.facebook.com/tools/explorer/" target="_blank" style="color:var(--blue)">developers.facebook.com/tools/explorer</a></li>
              <li>Selecione seu App no menu superior</li>
              <li>Clique em <strong>"Generate Access Token"</strong></li>
              <li>Adicione as permissões: <code style="background:#000;padding:1px 5px;border-radius:3px;color:var(--green)">ads_read</code> e <code style="background:#000;padding:1px 5px;border-radius:3px;color:var(--green)">ads_management</code></li>
              <li>Copie o token gerado (começa com <code style="background:#000;padding:1px 5px;border-radius:3px;color:var(--yellow)">EAA...</code>)</li>
            </ol>
            <p style="font-size:11px;color:var(--muted);margin-top:10px">⚡ Tokens do Graph Explorer expiram em ~1 hora. Para uso contínuo, gere um token de longa duração.</p>
          </div>

          <label style="font-size:12px;color:var(--muted);font-weight:600;display:block;margin-bottom:6px">Cole seu User Access Token aqui:</label>
          <textarea id="token-input" rows="3" placeholder="EAAxxxxxxxxxxxxxxx..." style="width:100%;background:#000;border:1px solid var(--border);color:#fff;border-radius:8px;padding:10px;font-size:12px;font-family:monospace;resize:vertical;outline:none">${getToken()}</textarea>

          <div style="display:flex;gap:10px;margin-top:16px">
            <button class="btn btn-primary" style="flex:1;padding:12px" onclick="saveTokenAndLoad()">
              🚀 Salvar Token e Buscar Dados
            </button>
          </div>
          <p style="font-size:11px;color:var(--muted);text-align:center;margin-top:10px">O token é salvo apenas no seu browser (localStorage).</p>
        </div>
      </div>
    </div>`;
}

function switchAccount() {
  localStorage.removeItem('meta_selected_account');
  localStorage.removeItem('meta_dashboard_data');
  loadData();
}

function saveTokenAndLoad() {
  const token = document.getElementById('token-input').value.trim();
  if (!token) { alert('Cole o token antes de continuar.'); return; }
  localStorage.setItem('meta_token', token);
  // Clear cached data to force fresh fetch
  localStorage.removeItem('meta_dashboard_data');
  loadData();
}

// Check localStorage cache
window.addEventListener('DOMContentLoaded', () => {
  const token = getToken();
  if (!token) {
    showTokenSetup(null);
    return;
  }
  try {
    const cached = localStorage.getItem('meta_dashboard_data');
    if (cached) {
      const parsed = JSON.parse(cached);
      const age = Date.now() - new Date(parsed.generated_at).getTime();
      if (age < 3600000) {
        globalData = parsed;
        renderDashboard();
        return;
      }
    }
  } catch(e) {}
  // Has token but no cache - auto load
  loadData();
});
</script>
